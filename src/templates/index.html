<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Custom NAO Control Panel</title>
    <style>
        body { font-family: sans-serif; text-align: center; padding-top: 50px; }
        input { padding: 10px; width: 250px; font-size: 16px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>NAO Robot Python Web Controller</h1>
    <input type="text" id="speechText" placeholder="Type something for NAO to say...">
    <button onclick="sendSpeech()">Speak</button>

    <script>
        function sendSpeech() {
            const textValue = document.getElementById('speechText').value;

            fetch('/say', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: textValue })
            })
            .then(res => res.json())
            .then(data => console.log(data))
            .catch(err => console.error('Error:', err));
        }
    </script>
</body>
</html>
