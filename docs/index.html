<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAO Classroom Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<template id="pageTemplate">
    <div class="stats">
        <div class="stat"><h4>Robot</h4><h2 id="robotCard">Checking</h2></div>
        <div class="stat"><h4>Camera</h4><h2 id="cameraCard">Checking</h2></div>
        <div class="stat"><h4>Active Session</h4><h2 id="attendanceCard">-</h2></div>
        <div class="stat"><h4>Students</h4><h2 id="studentCard">0</h2></div>
    </div>
    <div class="dashboard dashboard-overview">
        <section class="panel dashboard-timetable">
            <div class="panel-heading-row">
                <h2><i class="fa-solid fa-calendar-week"></i> This Week</h2>
                <a class="panel-link" href="subjects.html">Full timetable</a>
            </div>
            <div class="timetable-scroll">
                <table class="weekly-timetable">
                    <thead><tr><th>Time</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th></tr></thead>
                    <tbody id="dashboardTimetableBody"><tr><td colspan="6" class="table-empty">Loading timetable</td></tr></tbody>
                </table>
            </div>
        </section>
        <section class="panel session-panel">
            <h2><i class="fa-solid fa-robot"></i> Robot Session</h2>
            <table class="info-table">
                <tr><td>Status</td><td id="sessionStatus">Checking</td></tr>
                <tr><td>Session</td><td id="sessionID">-</td></tr>
                <tr><td>Remaining</td><td id="remainingTime">-</td></tr>
                <tr><td>Last Reason</td><td id="disconnectReason">-</td></tr>
            </table>
            <div style="display:flex;flex-direction:column;gap:10px;margin-top:16px">
                <label for="robotIpInput">NAO IP Address</label>
                <input id="robotIpInput" type="text" placeholder="192.168.200.137">
                <button id="robotConnectBtn" type="button">Connect Robot</button>
                <button id="robotDisconnectBtn" type="button" style="background:#fee2e2;color:#b91c1c">Disconnect Robot</button>
                <p id="robotConnectMessage" style="min-height:24px;font-weight:600"></p>
            </div>
        </section>
    </div>
</template>
<script src="js/api.js"></script>
<script>
renderNav("index.html");
document.getElementById("staticPageTitle").textContent = "Dashboard";
document.getElementById("robotIpInput").value =
    localStorage.getItem("nao_robot_ip") || "192.168.200.137";

async function refreshDashboard() {
    if (!getApiBase()) return;
    try {
        const [robot, attendance, students, vision] = await Promise.all([
            apiFetch("/api/ping"),
            apiFetch("/api/attendance/status"),
            apiFetch("/api/students"),
            apiFetch("/api/vision/status")
        ]);
        const rs = robot.status || robot || {};
        document.getElementById("robotCard").textContent =
            rs.connected ? "Ready" : "Not Ready";
        document.getElementById("sessionStatus").textContent =
            rs.connected ? "Connected" : "Offline";
        document.getElementById("sessionID").textContent =
            rs.session_id || "-";
        document.getElementById("remainingTime").textContent =
            rs.remaining || "-";
        document.getElementById("disconnectReason").textContent =
            rs.last_disconnect_reason || rs.disconnect_reason || "-";
        document.getElementById("attendanceCard").textContent =
            attendance.active ? "Active" : "None";
        document.getElementById("studentCard").textContent =
            (students.students || []).length;
        document.getElementById("cameraCard").textContent =
            vision.status && vision.status.running ? "Running" : "Idle";
    } catch (error) {
        console.error(error);
        document.getElementById("robotCard").textContent = "Unavailable";
        document.getElementById("sessionStatus").textContent = "Unavailable";
    }
}

refreshDashboard();
setInterval(refreshDashboard, 3000);

function dashboardTimeToMinutes(value) {
    const [hours, minutes] = String(value || "").split(":").map(Number);
    return Number.isFinite(hours) && Number.isFinite(minutes) ? hours * 60 + minutes : null;
}

function renderDashboardTimetable(subjects) {
    const body = document.getElementById("dashboardTimetableBody");
    const days = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"];
    body.innerHTML = "";

    for (let hour = 8; hour <= 18; hour++) {
        const row = document.createElement("tr");
        row.innerHTML = `<th>${String(hour).padStart(2, "0")}:00</th>`;

        days.forEach(day => {
            const cell = document.createElement("td");
            subjects
                .filter(subject =>
                    (subject.schedule_days || []).includes(day) &&
                    dashboardTimeToMinutes(subject.schedule_start) <= hour * 60 &&
                    dashboardTimeToMinutes(subject.schedule_end) > hour * 60
                )
                .forEach(subject => {
                    const entry = document.createElement("span");
                    entry.className = "timetable-entry";
                    entry.textContent = subject.class_code || subject.class_name || "Class";
                    entry.title = subject.class_name || "";
                    cell.appendChild(entry);
                });
            row.appendChild(cell);
        });
        body.appendChild(row);
    }
}

async function refreshDashboardTimetable() {
    if (!getApiBase()) return;
    try {
        const data = await apiFetch(`/api/subjects?t=${Date.now()}`);
        renderDashboardTimetable(data.subjects || []);
    } catch (error) {
        document.getElementById("dashboardTimetableBody").innerHTML =
            `<tr><td colspan="6" class="table-empty">${escapeHtml(error.message)}</td></tr>`;
    }
}

refreshDashboardTimetable();
setInterval(refreshDashboardTimetable, 60000);

async function connectRobot() {
    const ip = document.getElementById("robotIpInput").value.trim();
    const message = document.getElementById("robotConnectMessage");
    if (!ip) {
        message.textContent = "Enter the NAO IP address.";
        message.style.color = "#b91c1c";
        return;
    }
    localStorage.setItem("nao_robot_ip", ip);
    message.textContent = "Connecting...";
    message.style.color = "#475569";
    try {
        const result = await apiFetch("/api/connect", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ip: ip, port: 9559, duration: null})
        });
        message.textContent = result.message || "Robot connected.";
        message.style.color = "#15803d";
        await refreshDashboard();
    } catch (error) {
        message.textContent = error.message;
        message.style.color = "#b91c1c";
    }
}

async function disconnectRobot() {
    const message = document.getElementById("robotConnectMessage");
    try {
        await apiFetch("/api/disconnect", {method: "POST"});
        message.textContent = "Robot disconnected.";
        message.style.color = "#b91c1c";
        await refreshDashboard();
    } catch (error) {
        message.textContent = error.message;
        message.style.color = "#b91c1c";
    }
}

document.getElementById("robotConnectBtn").addEventListener("click", connectRobot);
document.getElementById("robotDisconnectBtn").addEventListener("click", disconnectRobot);
</script>
</body>
</html>
