<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Recognition</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<template id="pageTemplate">
<div class="voice-page">
 <section class="panel voice-panel voice-control-panel"><h2><i class="fa-solid fa-microphone-lines"></i> Voice Recognition Status</h2>
  <div class="voice-status-row"><span id="voiceStatusDot" class="voice-dot idle"></span><span id="voiceStatusText">Checking...</span></div>
  <div class="voice-current"><div></div><div><h4>Latest Command</h4><p id="latestVoiceCommand">No command recognized yet.</p></div><div><h4>Command Result</h4><p id="latestVoiceResult">Waiting for voice activity.</p></div></div>
 </section>
 <section class="panel voice-history-panel"><h2><i class="fa-solid fa-clock-rotate-left"></i> Voice Command History</h2><div id="voiceHistory" class="voice-history voice-history-large"><div class="voice-history-empty">No voice commands yet.</div></div></section>
 <section class="panel voice-command-manager"><h2><i class="fa-solid fa-list-check"></i> Predefined Commands</h2><button id="openVoiceCommandModal" class="voice-command-add" type="button"><i class="fa-solid fa-plus"></i> Add Command</button><div id="voiceCommands" class="voice-command-list">Loading predefined commands...</div></section>
</div>
<div id="voiceCommandModal" class="voice-command-modal hidden" role="dialog" aria-modal="true"><div class="voice-command-modal-card"><div class="voice-command-modal-header"><h3>Add Predefined Command</h3><button id="closeVoiceCommandModal" class="voice-command-modal-close" type="button">&times;</button></div><form id="voiceCommandForm" class="voice-command-form"><input id="voiceCommandKey" placeholder="Command key, e.g. greeting" required maxlength="80"><textarea id="voiceCommandResponse" placeholder="Robot response" required rows="4"></textarea><div id="voiceCommandPhraseTokens" class="voice-command-token-list"></div><input id="voiceCommandPhraseEntry" placeholder="Type a trigger phrase and press Enter"><span class="voice-command-form-help">Press Enter or comma after each trigger phrase.</span><div class="voice-command-modal-actions"><button id="cancelVoiceCommandModal" type="button" class="voice-command-cancel">Cancel</button><button type="submit">Save Command</button></div></form></div></div>
<div id="voiceDeleteModal" class="delete-confirm-modal hidden" role="dialog" aria-modal="true"><div class="delete-confirm-card"><h2>Delete Command</h2><p>Are you sure you want to delete this predefined voice command?</p><button id="cancelVoiceDelete" type="button">Cancel</button> <button id="confirmVoiceDelete" type="button">Delete Command</button></div></div>
</template>
<script src="js/api.js"></script><script src="js/voice.js"></script>
</body>
</html>
