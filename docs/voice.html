<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Recognition</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
<template id="pageTemplate">
<div class="voice-page">
 <section class="panel voice-panel voice-control-panel"><div class="voice-panel-heading"><h2><i class="fa-solid fa-microphone-lines"></i> Voice Recognition Status</h2><button id="voiceAnimationToggle" class="animation-toggle-button is-on" type="button" aria-pressed="true" aria-label="Toggle speech animation"><span data-animation-label>Animation On</span></button><p class="animation-toggle-error" role="alert" aria-live="polite"></p></div>
  <div class="voice-status-row"><span id="voiceStatusDot" class="voice-dot idle"></span><span id="voiceStatusText">Checking...</span></div>
  <div class="voice-current"><div></div><div><h4>Latest Command</h4><p id="latestVoiceCommand">No command recognized yet.</p></div><div><h4>Command Result</h4><p id="latestVoiceResult">Waiting for voice activity.</p></div></div>
 </section>
 <section class="panel voice-history-panel"><h2><i class="fa-solid fa-clock-rotate-left"></i> Voice Command History</h2><div id="voiceHistory" class="voice-history voice-history-large"><div class="voice-history-empty">No voice commands yet.</div></div></section>
 <section class="panel voice-command-manager"><h2><i class="fa-solid fa-list-check"></i> Predefined Commands</h2><button id="openVoiceCommandModal" class="voice-command-add" type="button"><i class="fa-solid fa-plus"></i> Add Command</button><div id="voiceCommands" class="voice-command-list">Loading predefined commands...</div></section>
</div>
<div id="voiceCommandModal" class="voice-command-modal hidden" role="dialog" aria-modal="true" aria-labelledby="voiceCommandModalTitle"><div class="voice-command-modal-card"><div class="voice-command-modal-header"><h3 id="voiceCommandModalTitle">Add Predefined Command</h3><button id="closeVoiceCommandModal" class="voice-command-modal-close" type="button" aria-label="Close">&times;</button></div><form id="voiceCommandForm" class="voice-command-form"><input id="voiceCommandKey" placeholder="Command key, e.g. greeting" required maxlength="80"><textarea id="voiceCommandResponse" placeholder="Robot response" required rows="4"></textarea><input id="voiceCommandPhraseEntry" placeholder="Type a trigger phrase and press Enter"><div id="voiceCommandPhraseTokens" class="voice-command-token-list"></div><span class="voice-command-form-help">Press Enter or comma after each trigger phrase.</span><div class="voice-command-modal-actions"><button id="cancelVoiceCommandModal" type="button" class="voice-command-cancel">Cancel</button><button id="saveVoiceCommandButton" type="submit">Save Command</button></div></form></div></div>
<div id="voiceDeleteModal" class="delete-confirm-modal hidden" role="dialog" aria-modal="true" aria-labelledby="voiceDeleteTitle"><section class="delete-confirm-card"><header class="delete-confirm-header"><h2 id="voiceDeleteTitle" class="delete-confirm-title"><i class="fa-solid fa-triangle-exclamation"></i> Delete Voice Command</h2><button id="closeVoiceDelete" class="delete-confirm-close" type="button" aria-label="Close">&times;</button></header><div class="delete-confirm-body">Are you sure you want to delete <strong id="voiceDeleteName"></strong>?</div><div class="delete-confirm-actions"><button id="cancelVoiceDelete" class="delete-confirm-cancel" type="button">Cancel</button><button id="confirmVoiceDelete" class="delete-confirm-submit" type="button">Delete Command</button></div></section></div>
</template>
<script src="js/api.js"></script><script src="js/voice-animation.js"></script><script src="js/voice.js"></script>
</body>
</html>
